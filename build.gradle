/**
 * 项目根目录构建配置 - 电视直播
 *
 * 构建命令：
 * - gradle clean          清理
 * - gradle assembleDebug  构建调试包（分发用这个）
 *
 * 技术栈：Gradle 8.13 / AGP 8.7.3 / JDK 21 / 纯 Java
 * 兼容：Android 4.4 (API 19) 及以上的电视盒子、电视
 */
plugins {
    id 'com.android.application' version '8.7.3' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
