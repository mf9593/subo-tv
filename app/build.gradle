/**
 * 电视直播主模块
 *
 * 目标设备：Android 4.4 (API 19) 及以上的电视/盒子，遥控器操作。
 */
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvlive.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvlive.app"
        // Android 4.4 起
        minSdk 19
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        // 电视盒子基本都是 arm 架构
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // ExoPlayer 2.19.1：最后一个支持 API 16+ 的版本（Media3 要求 API 21）
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-rtsp:2.19.1'
    // 二维码生成（纯 Java，兼容 API 19）
    implementation 'com.google.zxing:core:3.5.3'
}
